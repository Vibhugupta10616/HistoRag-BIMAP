experiment:
  name: H1_exp01_kmeans_k2
  hypothesis: H1
  description: >
    Unsupervised tumour grouping — K-means k=2.
    Tests whether tumour tissue is the dominant axis of variation in the
    encoder's embedding space. Clusters mapped to tumour/other by majority
    vote against .geojson ground-truth labels.

# Encoder whose embeddings to use. One of: clip-vitb16 | conch | uni2h
encoder: clip-vitb16

inputs:
  # Pre-computed patch embeddings (provided by user).
  # Shape: (N_patches, dim), float32, row-aligned to manifest_path.
  embeddings_path: data/embeddings/clip-vitb16/patch_embeddings.npy

  # Patch manifest produced by the tiling pipeline.
  manifest_path: data/patches/manifest.parquet

  # Directory containing one <slide_id>.geojson per slide (QuPath tumour annotations).
  geojson_dir: data/raw/annotations/

params:
  n_clusters: 2        # k=2: dominant-axis test
  random_state: 42

outputs:
  dir: hypotheses/H1_tumour_classification/exp01_kmeans_k2/outputs/
