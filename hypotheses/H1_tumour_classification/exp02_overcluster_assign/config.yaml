experiment:
  name: H1_exp02_overcluster_assign
  hypothesis: H1
  description: >
    Unsupervised tumour grouping — K-means k=8 (over-cluster then assign).
    Tests whether tumour signal is present in the encoder's embedding space even
    when tumour is NOT the dominant axis of variation. Over-clustering lets tumour
    patches form their own sub-cluster even if stain/tissue-type dominates the
    top split. Each cluster is labelled tumour/other by majority vote.

# Encoder whose embeddings to use. One of: clip-vitb16 | conch | uni2h
encoder: clip-vitb16

inputs:
  # Root directory containing all unzipped encoder folders (CLIP/, CONCH/, UNI/).
  embeddings_root: E:/embeddings

  # Directory containing one <slide_id>.geojson per slide (QuPath tumour annotations).
  # Download from HANCOCK dataset. Leave blank until available.
  geojson_dir: D:/College/Sem_5/HistoRag-BIMAP/WSI_PrimaryTumor_Annotations

params:
  n_clusters: 8        # k=8: over-cluster to recover buried tumour signal
  random_state: 42
  subsample_target: 2_500_000
  # patch_size: auto-detected from h5 coordinate step patterns.
  # Override here only if auto-detection gives wrong results.
  # Confirmed values: CLIP/CONCH = 1024, UNI = 2048.

outputs:
  dir: hypotheses/H1_tumour_classification/exp02_overcluster_assign/outputs/
