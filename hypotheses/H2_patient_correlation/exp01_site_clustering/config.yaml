experiment:
  name: H2_exp01_site_clustering
  hypothesis: H2
  question: Q1
  description: >
    Aggregate all patch embeddings per patient (mean pool -> 1 vector/patient).
    Compute UMAP and patient-patient correlation matrix.
    Expected result: clusters by anatomical site and a block-diagonal heatmap.

# Encoder whose embeddings to use. One of: conch | uni2h
encoder: conch

inputs:
  # Root directory containing all unzipped encoder folders (CLIP/, CONCH/, UNI/).
  embeddings_root: E:/embeddings

params:
  aggregation: mean
  umap:
    n_neighbors: 15
    min_dist: 0.1
    random_state: 42

outputs:
  dir: hypotheses/H2_patient_correlation/exp01_site_clustering/outputs/
