# HistoRAG Phase 1 — UNI2-h, slide-level retrieval (challenger B)
# Encoder: UNI2-h ViT-H/14 (histopathology vision-only SSL, MahmoodLab)
# Eval:    slide-level — patch embeddings mean-pooled to one vector per patient
#
# Hardware note:
#   UNI2-h requires ~10-14 GB VRAM at batch=32.
#   On GTX 1650 (4 GB): use precomputed_embeddings_path (encode on FAU lab machine).
#   On Colab T4 (16 GB): set device: cuda and run directly.
#
# Requirements before running:
#   pip install timm
#   huggingface-cli login  (MahmoodLab/UNI2-h access required)

run:
  name: phase1_uni2h_slide
  seed: 42
  out_dir: MVP/results/
  device: auto

data:
  dataset: hancock_wsi        # update with actual WSI dataset identifier
  raw_dir: data/raw
  slide_ids: []               # fill in when WSIs arrive from course
  label_source: slide_level
  label_map: MVP/configs/label_map.json

tiling:
  magnification: 20
  patch_size: 256
  stride: 256
  tissue_filter:
    method: otsu_hsv
    thumb_downsample: 32
    min_tissue_frac: 0.3
  max_patches_per_slide: 5000
  patches_dir: data/patches

encoder:
  name: uni2h
  output_dim: 1536
  batch_size: 8               # reduced from 32 -- ViT-H/14 is large; halve again if OOM
  # Set this to load embeddings encoded on the FAU lab machine instead of re-encoding locally.
  # Example: precomputed_embeddings_path: data/lab_exports/uni2h_embeddings.npy
  precomputed_embeddings_path: null

index:
  name: faiss-flatip
  normalize: true
  save_path: data/indexes/phase1_uni2h_slide.faiss

eval:
  level: slide
  aggregation: mean
  query_gallery_split:
    method: stratified_by_label
    query_frac: 0.2
  k_values: [1, 5, 10]
  compute_map_at: 10
  random_baseline: true
