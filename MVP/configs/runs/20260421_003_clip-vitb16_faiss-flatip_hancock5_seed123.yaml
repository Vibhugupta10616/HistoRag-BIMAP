data:
  dataset: hancock5
  label_map: configs/label_map.json
  label_source: slide_level
  raw_dir: data/raw
  slide_ids:
  - InvasionFront_CD3_block1
  - TumorCenter_CD3_block1
encoder:
  batch_size: 32
  model_id: ViT-B-16
  name: clip-vitb16
  preprocess:
    normalize: clip_openai
    resize: 224
  pretrained: openai
eval:
  compute_map_at: 10
  k_values:
  - 1
  - 5
  - 10
  query_gallery_split:
    method: stratified_within_slide
    query_frac: 0.2
  random_baseline: true
index:
  name: faiss-flatip
  normalize: true
  save_path: data/indexes/phase0_mvp.faiss
run:
  device: auto
  name: phase0_mvp
  out_dir: experiments/
  seed: 123
tiling:
  magnification: 20
  max_patches_per_slide: 5000
  patch_size: 256
  patches_dir: data/patches
  stride: 256
  tissue_filter:
    method: otsu_hsv
    min_tissue_frac: 0.3
    thumb_downsample: 32
