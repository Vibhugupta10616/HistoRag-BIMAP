# HackDay2 — Single-WSI HDBSCAN Pipeline
# ─────────────────────────────────────────
# Step 1: Set data_root to wherever you downloaded the Google Drive folder
# Step 2: Set slide_id to whichever WSI you want to run (e.g. PrimaryTumor_HE_034)
# Step 3: Run the pipeline (see README for which command to use)

# ── paths ────────────────────────────────────────────────────────────────────

data_root: "Weights and WSIs"                # folder inside the repo root (relative path)

slide_id: "PrimaryTumor_HE_010"             # which slide to run — change this to switch WSIs

# derived paths (no need to change these)
wsi_path: null          # set via CLI: --wsi or auto-derived below if null
geojson_path: null      # set to null to skip ground-truth plot, or set explicitly

outputs_dir: "Hackday2/outputs"

# ── patching (only needed for full pipeline) ─────────────────────────────────

patching:
  patch_size: 256
  level: 1                                   # pyramid level 1 = 4x downsample (~5k patches per slide)
  tissue_threshold: 0.1
  max_patches: null                          # e.g. 1000 for a quick test; null = use all
  batch_size: 64

# ── CONCH weights (only needed for full pipeline) ────────────────────────────

conch:
  checkpoint: null                           # auto-set to <data_root>/conch/pytorch_model.bin

# ── clustering ───────────────────────────────────────────────────────────────

pca:
  n_components: 20

hdbscan:
  min_cluster_size: 50
  min_samples: null

umap:
  n_neighbors: 15
  min_dist: 0.1
  random_state: 42
  max_points: 20000                          # null = use all patches for UMAP
